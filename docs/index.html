<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaspyDarts</title>
<meta name="description" content="Graver l'image RaspyDarts, préparer sa configuration et démarrer la borne">
<style>
:root {
  --bg: #f4f1ec; --panel: #ffffff; --text: #1d1b19; --muted: #6b645c; --line: #ddd6cc;
  --accent: #b3261e; --accent-text: #ffffff; --ok: #2e7d32; --warn: #a15c00; --code: #f0ebe3;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161412; --panel: #211e1b; --text: #eee9e2; --muted: #a59d93; --line: #3a352f;
    --accent: #e0574e; --accent-text: #1a0d0c; --ok: #6cc070; --warn: #e0a040; --code: #2b2723;
  }
}
:root[data-theme="dark"] {
  --bg: #161412; --panel: #211e1b; --text: #eee9e2; --muted: #a59d93; --line: #3a352f;
  --accent: #e0574e; --accent-text: #1a0d0c; --ok: #6cc070; --warn: #e0a040; --code: #2b2723;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header .brand { text-align: center; }
header h1 { margin: 0 0 6px; font-size: 1.7rem; letter-spacing: .5px; }
header h1 span { color: var(--accent); }
nav.menu { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
nav.menu select { padding: 3px 6px; margin-left: 6px; }
nav.menu a, nav.menu button { border: 1px solid transparent; background: none; color: var(--text); font: inherit; padding: 4px 12px; border-radius: 999px; cursor: pointer; text-decoration: none; }
nav.menu .active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
nav.menu a:hover, nav.menu button:hover { border-color: var(--line); }
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--text); padding: 20px 24px; text-align: center; }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog p { font-size: 1.1rem; margin: 0 0 14px; }
.carousel-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0 12px; }
.carousel-nav button.arrow { font-size: 2rem; line-height: 1; width: 52px; height: 44px; padding: 0 0 4px; border-radius: 10px; flex: none; }
.slide figure { position: relative; }
.slide figure .side { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 64px; border: none; border-radius: 10px;
  background: rgba(0, 0, 0, .55); color: #fff; font-size: 2.2rem; line-height: 1; cursor: pointer; padding: 0 0 6px; }
.slide figure .side:hover { background: var(--accent); }
.slide figure .side.left { left: 6px; }
.slide figure .side.right { right: 6px; }
.carousel-nav button.arrow.wide, .slide figure .side.wide { width: auto; font-size: 1.05rem; font-weight: 600; padding: 0 16px; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.dots button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font: inherit; font-size: .75rem; cursor: pointer; padding: 0; }
.dots button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.slide { display: none; }
.slide.active { display: block; }
.slide-text { min-height: 4.8em; }
.slide-text p { display: inline; margin: 0; }
.slide-text .note { display: block; margin: 0; }
.slide figure img { margin: 0 auto; }
figure { margin: 8px 0 0; }
figure img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; }
figcaption { color: var(--muted); font-size: .85rem; margin-top: 4px; }
.center { text-align: center; }
button.big { font-size: 1.1rem; font-weight: 600; padding: 12px 28px; border-radius: 10px; box-shadow: 0 3px 10px rgba(0, 0, 0, .18); }
button.big:hover { filter: brightness(1.1); }
details { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; margin-top: 14px; }
details summary { cursor: pointer; font-weight: 600; }
main { max-width: 860px; margin: 0 auto; padding: 16px; }
nav.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
nav.steps button { flex: 1 1 120px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: var(--radius); padding: 8px 10px; font: inherit; font-size: .9rem; cursor: pointer; text-align: left; }
nav.steps button b { display: block; font-size: .75rem; }
nav.steps button.active { border-color: var(--accent); color: var(--text); box-shadow: inset 0 -3px 0 var(--accent); }
section.step { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 8px; }
section.step.active { display: block; }
h2 { margin: 0 0 10px; font-size: 1.2rem; }
h3 { margin: 22px 0 8px; font-size: 1.02rem; }
ol, ul { padding-left: 22px; }
li { margin: 4px 0; }
.note { border-left: 4px solid var(--accent); background: var(--code); padding: 8px 12px; border-radius: 0 var(--radius) var(--radius) 0; margin: 12px 0; }
.note.warn { border-color: var(--warn); }
.note.ok { border-color: var(--ok); }
code, .codebox { font-family: ui-monospace, Consolas, monospace; background: var(--code); border-radius: 6px; }
code { padding: 1px 5px; }
.codebox { display: flex; gap: 8px; align-items: center; padding: 8px 10px; margin: 8px 0; word-break: break-all; }
.codebox span { flex: 1; }
button.small, a.button, button.main { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
button.small { padding: 3px 10px; font-size: .85rem; }
button.ghost { background: transparent; color: var(--text); border-color: var(--line); }
button:disabled { opacity: .5; cursor: default; }
.actions { display: flex; justify-content: space-between; gap: 10px; margin: 18px 0 10px; }
.actions.top { margin: 0 0 14px; }
label { display: block; font-weight: 600; margin: 12px 0 4px; }
.hint { color: var(--muted); font-size: .9rem; margin: 2px 0 6px; }
select, input[type="number"], input[type="text"] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
.choice { display: flex; gap: 16px; flex-wrap: wrap; }
.choice label { font-weight: 400; display: flex; gap: 6px; align-items: center; margin: 4px 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.grid div label { font-weight: 400; font-size: .85rem; margin: 0 0 2px; }
.grid input, .grid select { width: 100%; }
fieldset { border: 1px solid var(--line); border-radius: var(--radius); margin: 14px 0; padding: 4px 14px 12px; }
legend { font-weight: 700; padding: 0 6px; }
.hidden { display: none !important; }
.errors { color: var(--accent); font-weight: 600; }
.errors li { margin: 2px 0; }
input.bad, select.bad { border-color: var(--accent); outline: 2px solid var(--accent); }
pre#preview { background: var(--code); padding: 10px; border-radius: var(--radius); max-height: 260px; overflow: auto; font-size: .8rem; }
.savebar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0; }
#save-status { font-weight: 600; }
footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 18px 16px 30px; }
.cfg-slide { display: none; min-height: 260px; }
.cfg-slide.active { display: block; }
.cfg-slide h3 { margin-top: 4px; }
#tl-map { grid-template-columns: repeat(4, minmax(80px, 1fr)); }
#tl-map .seg-name { font-weight: 600; }
.choicebar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 14px 0; }
.choicebar button.chosen { outline: 3px solid var(--accent); outline-offset: 2px; }
#menus-frame { width: 100%; height: 600px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); display: block; }
body.wide main { max-width: 1800px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Raspy<span>Darts</span></h1>
    <nav class="menu">
      <a class="active" href="#1" data-t="menu-install"></a>
      <a href="https://raspydarts.wordpress.com/" target="_blank" rel="noopener" data-t="menu-site"></a>
      <select id="lang" aria-label="Langue">
        <option value="fr">Français</option><option value="en">English</option><option value="de">Deutsch</option>
        <option value="es">Español</option><option value="it">Italiano</option>
      </select>
    </nav>
  </div>
</header>


<main>
  <nav class="steps" id="steps"></nav>
  <div class="actions top">
    <button class="main ghost" data-move="-1" data-t="prev"></button>
    <button class="main" data-move="1" data-t="next"></button>
  </div>

  <!-- 1. Préparer -->
  <section class="step" data-step="1">
    <h2 data-t="s1-title"></h2>
    <p data-t="s1-intro"></p>
    <ul>
      <li data-t="s1-pi"></li>
      <li data-t="s1-sd"></li>
      <li data-t="s1-pc"></li>
    </ul>
    <h3 data-t="s1-imager"></h3>
    <p data-t="s1-imager-text"></p>
    <p><a class="button" href="https://www.raspberrypi.com/software/" target="_blank" rel="noopener" data-t="s1-download"></a></p>
  </section>

  <!-- 2. Graver : captures de Raspberry Pi Imager 2.0.12 -->
  <section class="step" data-step="2">
    <h2 data-t="s2-title"></h2>
    <div class="carousel" id="carousel">
      <div class="carousel-nav">
        <button class="main arrow" id="slide-prev" aria-label="‹">‹</button>
        <div class="dots" id="dots"></div>
        <button class="main arrow" id="slide-next" aria-label="›">›</button>
      </div>
      <div class="slide" data-index="0"><div class="slide-text"><b>1.</b> <p data-t="s2-options"></p></div>
        <figure><a href="images/imager/imager-01-appareil.png" target="_blank" rel="noopener"><img src="images/imager/imager-01-appareil.png" alt="" loading="lazy" width="682" height="482"></a></figure></div>
      <div class="slide" data-index="1"><div class="slide-text"><b>2.</b> <p data-t="s2-modify"></p></div>
        <figure><a href="images/imager/imager-02-options.png" target="_blank" rel="noopener"><img src="images/imager/imager-02-options.png" alt="" loading="lazy" width="682" height="482"></a></figure></div>
      <div class="slide" data-index="2"><div class="slide-text"><b>3.</b> <p data-t="s2-repo"></p>
        <div class="codebox"><span id="repo-url"></span><button class="small" data-copy="repo-url" data-t="copy"></button></div></div>
        <figure><a href="images/imager/imager-03-depot.png" target="_blank" rel="noopener"><img src="images/imager/imager-03-depot.png" alt="" loading="lazy" width="682" height="482"></a></figure></div>
      <div class="slide" data-index="3"><div class="slide-text"><b>4.</b> <p data-t="s2-restarted"></p></div>
        <figure><a href="images/imager/imager-04-depot-actif.png" target="_blank" rel="noopener"><img src="images/imager/imager-04-depot-actif.png" alt="" loading="lazy" width="682" height="482"></a></figure></div>
      <div class="slide" data-index="4"><div class="slide-text"><b>5.</b> <p data-t="s2-os"></p></div>
        <figure><a href="images/imager/imager-05-os.png" target="_blank" rel="noopener"><img src="images/imager/imager-05-os.png" alt="" loading="lazy" width="682" height="482"></a></figure></div>
      <div class="slide" data-index="5"><div class="slide-text"><b>6.</b> <p data-t="s2-storage"></p></div>
        <figure><a href="images/imager/imager-06-stockage.png" target="_blank" rel="noopener"><img src="images/imager/imager-06-stockage.png" alt="" loading="lazy" width="682" height="482"></a></figure></div>
      <div class="slide" data-index="6"><div class="slide-text"><b>7.</b> <p data-t="s2-hostname"></p></div>
        <figure><a href="images/imager/imager-07-nom-hote.png" target="_blank" rel="noopener"><img src="images/imager/imager-07-nom-hote.png" alt="" loading="lazy" width="682" height="482"></a></figure></div>
      <div class="slide" data-index="7"><div class="slide-text"><b>8.</b> <p data-t="s2-locale"></p></div>
        <figure><a href="images/imager/imager-08-localisation.png" target="_blank" rel="noopener"><img src="images/imager/imager-08-localisation.png" alt="" loading="lazy" width="682" height="482"></a></figure></div>
      <div class="slide" data-index="8"><div class="slide-text"><b>9.</b> <p class="note warn" data-t="s2-user"></p></div>
        <figure><a href="images/imager/imager-09-utilisateur.png" target="_blank" rel="noopener"><img src="images/imager/imager-09-utilisateur.png" alt="" loading="lazy" width="682" height="482"></a></figure></div>
      <div class="slide" data-index="9"><div class="slide-text"><b>10.</b> <p data-t="s2-wifi"></p></div>
        <figure><a href="images/imager/imager-10-wifi.png" target="_blank" rel="noopener"><img src="images/imager/imager-10-wifi.png" alt="" loading="lazy" width="682" height="482"></a></figure></div>
      <div class="slide" data-index="10"><div class="slide-text"><b>11.</b> <p data-t="s2-ssh"></p></div>
        <figure><a href="images/imager/imager-11-ssh.png" target="_blank" rel="noopener"><img src="images/imager/imager-11-ssh.png" alt="" loading="lazy" width="682" height="482"></a></figure></div>
      <div class="slide" data-index="11"><div class="slide-text"><b>12.</b> <p data-t="s2-write"></p></div>
        <figure><a href="images/imager/imager-12-ecrire.png" target="_blank" rel="noopener"><img src="images/imager/imager-12-ecrire.png" alt="" loading="lazy" width="682" height="482"></a></figure></div>
      <div class="slide" data-index="12"><div class="slide-text"><b>13.</b> <p data-t="s2-confirm"></p></div>
        <figure><a href="images/imager/imager-13-confirmation.png" target="_blank" rel="noopener"><img src="images/imager/imager-13-confirmation.png" alt="" loading="lazy" width="682" height="482"></a></figure></div>
    </div>
    <div class="note" data-t="s2-access"></div>
  </section>

  <!-- 3. Configurer -->
  <section class="step" data-step="3">
    <h2 data-t="s3-title"></h2>
    <p data-t="s3-intro"></p>
    <p class="center"><button class="main big" id="own-file" data-t="own-file"></button></p>
    <div id="own-file-info" class="note ok hidden center"><p data-t="own-file-info"></p>
      <button class="main big" id="own-file-undo" data-t="own-file-undo"></button></div>

    <div id="config-form">
    <!-- Une question par ecran (comme les captures de l'etape 2) -->
    <div class="carousel-nav">
      <button class="main arrow" id="cfg-prev" aria-label="‹">‹</button>
      <div class="dots" id="cfg-dots"></div>
      <button class="main arrow" id="cfg-next" aria-label="›">›</button>
    </div>

    <div class="cfg-slide" data-q="lang">
      <h3 data-t="q-lang"></h3>
      <select id="locale">
        <option value="fr_FR">Français</option><option value="en_GB">English</option><option value="de_DE">Deutsch</option>
        <option value="es_ES">Español</option><option value="it_IT">Italiano</option>
      </select>
    </div>

    <div class="cfg-slide" data-q="card">
      <h3 data-t="f-target"></h3>
      <label for="card" data-t="f-card"></label>
      <select id="card"></select>
      <p class="hint" id="card-hint"></p>
      <div id="custom-pins" class="hidden">
        <p class="hint" data-t="f-custom-hint"></p>
        <label data-t="f-outputs"></label>
        <div class="grid" id="outputs"></div>
        <label data-t="f-inputs"></label>
        <div class="grid" id="inputs"></div>
      </div>
    </div>

    <div class="cfg-slide" data-q="buttons">
      <h3 data-t="f-buttons"></h3>
      <label for="mcp-count" data-t="f-mcp"></label>
      <p class="hint" data-t="f-mcp-hint"></p>
      <select id="mcp-count"></select>
      <div id="mcp-pins" class="grid"></div>
      <details>
        <summary data-t="f-gpio-buttons"></summary>
        <p class="hint" data-t="f-gpio-buttons-hint"></p>
        <div class="grid" id="gpio-buttons"></div>
      </details>
    </div>

    <div class="cfg-slide" data-q="target">
      <h3 data-t="q-target"></h3>
      <div class="choice">
        <label><input type="radio" name="tl-kind" value="none" data-keep> <span data-t="q-target-none"></span></label>
        <label><input type="radio" name="tl-kind" value="raspy" data-keep> <span data-t="q-target-raspy"></span></label>
        <label><input type="radio" name="tl-kind" value="other" data-keep> <span data-t="q-target-other"></span></label>
      </div>
      <div id="target-led-fields" class="hidden">
        <div class="grid">
          <div><label for="tl-pin" data-t="f-gpio"></label><input type="number" id="tl-pin" min="1" max="27" value="21" data-keep></div>
          <div><label for="tl-bri" data-t="f-bright"></label><input type="number" id="tl-bri" min="1" max="100" value="30" data-keep></div>
          <div><label for="tl-typ" data-t="f-type"></label><select id="tl-typ" data-keep><option value="grb">GRB</option><option value="rgb">RGB</option></select></div>
        </div>
      </div>
      <div id="target-other" class="hidden">
        <p data-t="q-target-numbers"></p>
        <div class="choice">
          <label><input type="radio" name="tl-map" value="later" data-keep> <span data-t="q-target-later"></span></label>
          <label><input type="radio" name="tl-map" value="manual" data-keep> <span data-t="q-target-manual"></span></label>
        </div>
        <div id="tl-map-fields" class="hidden">
          <p class="hint" data-t="q-target-manual-hint"></p>
          <div class="grid" id="tl-map"></div>
        </div>
      </div>
    </div>

    <div class="cfg-slide" data-q="strip">
      <h3 data-t="q-strip"></h3>
      <div class="choice">
        <label><input type="checkbox" id="strip-led" data-keep> <span data-t="f-strip-led"></span></label>
      </div>
      <div id="strip-led-fields" class="grid hidden">
        <div><label for="sl-pin" data-t="f-gpio"></label><input type="number" id="sl-pin" min="1" max="27" value="12" data-keep></div>
        <div><label for="sl-nbr" data-t="f-count"></label><input type="number" id="sl-nbr" min="1" max="1000" value="144" data-keep></div>
        <div><label for="sl-bri" data-t="f-bright"></label><input type="number" id="sl-bri" min="1" max="100" value="30" data-keep></div>
        <div><label for="sl-typ" data-t="f-type"></label><select id="sl-typ" data-keep><option value="grb">GRB</option><option value="rgb">RGB</option></select></div>
      </div>
    </div>

    <div class="cfg-slide" data-q="videos">
      <h3 data-t="q-videos"></h3>
      <div class="choice">
        <label><input type="radio" name="videos" value="2" data-keep> <span data-t="q-videos-all"></span></label>
        <label><input type="radio" name="videos" value="1" data-keep> <span data-t="q-videos-some"></span></label>
        <label><input type="radio" name="videos" value="0" data-keep> <span data-t="q-videos-none"></span></label>
      </div>
    </div>

    <div class="cfg-slide" data-q="sounds">
      <h3 data-t="q-sounds"></h3>
      <div class="choice">
        <label><input type="radio" name="sounds" value="on" data-keep> <span data-t="q-sounds-on"></span></label>
        <label><input type="radio" name="sounds" value="off" data-keep> <span data-t="q-sounds-off"></span></label>
      </div>
    </div>

    <div class="cfg-slide" data-q="announce">
      <h3 data-t="q-announce"></h3>
      <p class="hint" data-t="q-announce-hint"></p>
      <div class="choice">
        <label><input type="radio" name="announce" value="on" data-keep> <span data-t="q-yes"></span></label>
        <label><input type="radio" name="announce" value="off" data-keep> <span data-t="q-no"></span></label>
      </div>
    </div>

    <div class="cfg-slide" data-q="camera">
      <h3 data-t="q-camera"></h3>
      <p class="hint" data-t="q-camera-hint"></p>
      <div class="choice">
        <label><input type="radio" name="camera" value="off" data-keep> <span data-t="q-camera-none"></span></label>
        <label><input type="radio" name="camera" value="usb" data-keep> <span data-t="q-camera-usb"></span></label>
      </div>
    </div>

    <div class="cfg-slide" data-q="players">
      <h3 data-t="q-players"></h3>
      <p class="hint" data-t="q-players-hint"></p>
      <textarea id="players" rows="6" style="width:100%;max-width:420px" data-keep></textarea>
    </div>

    <div class="cfg-slide" data-q="end">
      <h3 data-t="q-end"></h3>
      <ul class="errors" id="errors"></ul>
      <p id="cfg-review"></p>
      <p class="note ok" id="cfg-ready" data-t="q-end-ok"></p>
      <div class="savebar">
        <button class="main ghost" id="cfg-copy" data-t="cfg-copy"></button>
        <span id="cfg-copy-status"></span>
      </div>
      <p class="hint" data-t="f-file-next"></p>
    </div>
    </div>
  </section>

  <!-- 4. Menus (facultatif) : le configurateur (menus.html) dans la page -->
  <section class="step" data-step="4">
    <h2 data-t="sm-title"></h2>
    <p data-t="sm-intro"></p>
    <div class="choicebar">
      <button class="main big" id="menus-make" data-t="sm-make"></button>
      <button class="main big ghost" id="menus-have" data-t="sm-have"></button>
      <button class="main big ghost" id="menus-skip" data-t="sm-skip"></button>
    </div>
    <div id="menus-theme-box" class="hidden">
      <label for="menus-theme" data-t="sm-theme"></label>
      <div class="savebar" style="margin:4px 0">

<script src="vendor/js-yaml.min.js"></script>
<script src="presets.js"></script>
<script src="texts.js"></script>
<script>
'use strict';
const REPO_URL = 'https://raw.githubusercontent.com/rmdelcelier/RaspyDarts/main/rpi-imager.json';
const LANGS = ['fr', 'en', 'de', 'es', 'it'];
const LOCALES = {fr: 'fr_FR', en: 'en_GB', de: 'de_DE', es: 'es_ES', it: 'it_IT'};
// Buttons wired directly on the GPIO of the Raspberry ([SectionKeys] of the game)
const GPIO_BUTTONS = ['PLAYERBUTTON', 'GAMEBUTTON', 'BACKUPBUTTON', 'EXTRABUTTON', 'MISSDART', 'SHOCKSENSOR'];

const $ = (id) => document.getElementById(id);
let lang = 'fr';
let step = 1;
const STEPS = 6;
const STEP_NAMES = ['step1', 'step2', 'step3', 'step-menus', 'step4', 'step5'];

function t(key, values) {
  let text = (T[lang] && T[lang][key]) || T.en[key] || T.fr[key] || key;
  for (const [name, value] of Object.entries(values || {})) text = text.replaceAll(`{${name}}`, value);
  return text;
}

function label(name) {
  // Names of the game (locales/*/pydarts.po), else those of the page, else the key
  return PRESETS.labels[lang][name] || PRESETS.labels.en[name] || PRESETS.labels.fr[name] || name;
}

function store(key, value) {
  try { localStorage.setItem(`raspydarts-${key}`, value); } catch (error) { /* private window */ }
}
function stored(key) {
  try { return localStorage.getItem(`raspydarts-${key}`); } catch (error) { return null; }
}

// ------------------------------------------------------------------ steps
function buildSteps() {
  const nav = $('steps');
  nav.innerHTML = '';
  for (let index = 1; index <= STEPS; index++) {
    const button = document.createElement('button');
    button.innerHTML = `<b>${index}</b>${t(STEP_NAMES[index - 1])}`;
    button.classList.toggle('active', index === step);
    button.addEventListener('click', () => show(index));
    nav.appendChild(button);
  }
}

function show(index) {
  step = Math.min(Math.max(index, 1), STEPS);
  document.querySelectorAll('section.step').forEach((section) => {
    section.classList.toggle('active', Number(section.dataset.step) === step);
  });
  document.querySelectorAll('[data-move="-1"]').forEach((button) => { button.disabled = step === 1; });
  document.querySelectorAll('[data-move="1"]').forEach((button) => { button.disabled = step === STEPS; });
  buildSteps();
  updateMenus();
  store('step', step);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function translate() {
  document.documentElement.lang = lang;
  document.title = `RaspyDarts · ${t('menu-install')}`;
  document.querySelectorAll('[data-t]').forEach((element) => { element.innerHTML = t(element.dataset.t); });
  buildSteps();
  if (typeof showSlide === 'function' && SLIDES.length) showSlide(slide);
  buildCards();
  buildMcp();
  buildGpioButtons();
  update();
}

// ------------------------------------------------------------------ form
function buildCards() {
  const select = $('card');
  const current = select.value || stored('card') || 'Au';
  select.innerHTML = '';
  for (const [group, codes] of PRESETS.groups) {
    const parent = group ? document.createElement('optgroup') : select;
    if (group) { parent.label = group; select.appendChild(parent); }
    for (const code of codes) parent.appendChild(new Option(PRESETS.cards[code].name, code));
  }
  select.appendChild(new Option(t('f-other'), 'Au'));
  select.value = current;
}

function pinFields(container, names, prefix) {
  if (container.children.length) return;
  for (const name of names) {
    const div = document.createElement('div');
    div.innerHTML = `<label for="${prefix}-${name}">${name.replace('PIN_', 'PIN ')}</label>` +
      `<input type="number" min="1" max="27" id="${prefix}-${name}" data-pin="${name}">`;
    container.appendChild(div);
  }
}

function mcpPins(count) {
  const pins = [];
  for (let card = 0; card < count; card++) {
    for (const bank of [0, 1]) {
      const letter = String.fromCharCode(65 + 2 * card + bank);
      for (let number = 0; number < 8; number++) pins.push(`${letter}${number}`);
    }
  }
  return pins;
}

function mcpDefaults() {
  // Pin -> name : the card chosen (its buttons), else those of the game
  const code = $('card').value;
  const mapping = code !== 'Au' ? PRESETS.cards[code].extended : PRESETS.extender;
  const defaults = {};
  for (const name of Object.keys(PRESETS.extender)) {
    const pin = mapping[name];
    if (pin && /^[A-P][0-7]$/.test(pin)) defaults[pin] = name;
  }
  return defaults;
}

function buildMcp() {
  const select = $('mcp-count');
  const current = select.value || stored('mcp') || '1';
  select.innerHTML = '';
  select.appendChild(new Option(t('f-mcp-none'), '0'));
  for (let count = 1; count <= 8; count++) select.appendChild(new Option(t('f-mcp-n', {n: count}), String(count)));
  select.value = current;
  fillMcp();
}

function fillMcp() {
  const container = $('mcp-pins');
  const chosen = {};
  container.querySelectorAll('select').forEach((select) => { chosen[select.dataset.pin] = select.value; });
  const defaults = Object.keys(chosen).length ? chosen : mcpDefaults();
  container.innerHTML = '';
  for (const pin of mcpPins(Number($('mcp-count').value))) {
    const div = document.createElement('div');
    const select = document.createElement('select');
    select.id = `mcp-${pin}`;
    select.dataset.pin = pin;
    select.appendChild(new Option(t('f-none'), ''));
    for (const name of Object.keys(PRESETS.extender)) select.appendChild(new Option(label(name), name));
    select.value = defaults[pin] || '';
    select.addEventListener('change', update);
    div.innerHTML = `<label for="mcp-${pin}">${pin}</label>`;
    div.appendChild(select);
    container.appendChild(div);
  }
}

function buildGpioButtons() {
  const container = $('gpio-buttons');
  const values = {};
  container.querySelectorAll('input').forEach((input) => { values[input.dataset.key] = input.value; });
  container.innerHTML = '';
  for (const key of GPIO_BUTTONS) {
    const div = document.createElement('div');
    div.innerHTML = `<label for="gb-${key}">${t(key)}</label><input type="number" min="1" max="27" id="gb-${key}" data-key="${key}">`;
    div.querySelector('input').value = values[key] || '';
    container.appendChild(div);
  }
}

// ------------------------------------------------------------------ file
function values(container) {
  const result = {};
  container.querySelectorAll('input[data-pin]').forEach((input) => { result[input.dataset.pin] = input.value.trim(); });
  return result;
}

function radio(name) {
  const checked = document.querySelector(`input[name="${name}"]:checked`);
  return checked ? checked.value : null;
}
function build() {
  const errors = [];
  const used = {};
  const marked = [];
  const gpio = (what, value, element) => {
    if (value === '') return '';
    const pin = Number(value);
    if (!Number.isInteger(pin) || pin < 1 || pin > 27) {
      errors.push(t('err-gpio', {what, pin: value}));
      if (element) marked.push(element);
    } else if (used[pin]) {
      errors.push(t('err-twice', {pin}));
      if (element) marked.push(element);
    }
    used[pin] = true;
    return String(pin);
  };
  const number = (what, element, min, max) => {
    const value = Number(element.value);
    if (!Number.isInteger(value) || value < min || value > max) { errors.push(t('err-number', {what})); marked.push(element); }
    return String(value);
  };

  const code = $('card').value;
  const card = code !== 'Au' ? PRESETS.cards[code] : null;
  let outputs, inputs, keys;
  if (card) {
    outputs = card.outputs;
    inputs = card.inputs;
    keys = Object.assign({}, card.keys);
    Object.values(outputs).concat(Object.values(inputs)).forEach((pin) => { if (pin) used[Number(pin)] = true; });
  } else {
    outputs = {}; inputs = {}; keys = {};
    for (const [name, value] of Object.entries(values($('outputs')))) outputs[name] = gpio(`${t('f-outputs')} ${name}`, value, $(`out-${name}`));
    for (const [name, value] of Object.entries(values($('inputs')))) inputs[name] = gpio(`${t('f-inputs')} ${name}`, value, $(`in-${name}`));
    if (!Object.values(outputs).some(Boolean) || !Object.values(inputs).some(Boolean)) { errors.push(t('err-nopins')); marked.push($('card')); }
    // Segments learnt at the first start
    for (const key of PRESETS.keys) keys[key] = '';
  }
  for (const key of GPIO_BUTTONS) {
    const input = $(`gb-${key}`);
    const value = gpio(t(key), input.value.trim(), input);
    if (value !== '' || !card) keys[key] = value;
  }

  const leds = {PIN_TARGETLED: '0', BRI_TARGETLED: '0', TYP_TARGETLED: 'grb', PIN_STRIPLED: '0', NBR_STRIPLED: '0', BRI_STRIPLED: '0', TYP_STRIPLED: 'grb'};
  let targetMap = null;
  // LED dans la cible : non, des RaspyLeds (repartition connue), ou d'autres (numeros donnes
  // ici, ou appris plus tard dans Parametres > Affectation des leds)
  const kind = radio('tl-kind') || 'none';
  if (kind !== 'none') {
    leds.PIN_TARGETLED = gpio(t('f-target-led'), $('tl-pin').value.trim(), $('tl-pin')) || '0';
    leds.BRI_TARGETLED = number(`${t('f-target-led')} : ${t('f-bright')}`, $('tl-bri'), 1, 100);
    leds.TYP_TARGETLED = $('tl-typ').value;
    if (kind === 'raspy') targetMap = PRESETS.target_leds[card ? card.target_leds : 'ji'];
    else if (radio('tl-map') === 'manual') {
      targetMap = {};
      $('tl-map').querySelectorAll('input').forEach((input) => {
        const value = input.value.replace(/\s+/g, '');
        if (!value) return;
        if (!/^\d+(,\d+)*$/.test(value)) { errors.push(t('err-leds', {segment: input.dataset.segment})); marked.push(input); }
        targetMap[input.dataset.segment] = value;
      });
    }
  }
  if ($('strip-led').checked) {
    leds.PIN_STRIPLED = gpio(t('f-strip-led'), $('sl-pin').value.trim(), $('sl-pin')) || '0';
    leds.NBR_STRIPLED = number(`${t('f-strip-led')} : ${t('f-count')}`, $('sl-nbr'), 1, 1000);
    leds.BRI_STRIPLED = number(`${t('f-strip-led')} : ${t('f-bright')}`, $('sl-bri'), 1, 100);
    leds.TYP_STRIPLED = $('sl-typ').value;
  }

  // Extension cards : every button, light and toy, on its pin or none
  const extended = {};
  for (const name of Object.keys(PRESETS.extender)) extended[name] = '';
  const pins = {};
  $('mcp-pins').querySelectorAll('select').forEach((select) => {
    select.classList.remove('bad');
    if (!select.value) return;
    (pins[select.value] = pins[select.value] || []).push(select);
    extended[select.value] = select.dataset.pin;
  });
  for (const [name, selects] of Object.entries(pins)) {
    if (selects.length > 1) {
      errors.push(t('err-mcp-twice', {name: label(name), pins: selects.map((select) => select.dataset.pin).join(', ')}));
      marked.push(...selects);
    }
  }

  const section = (name, entries) => `[${name}]\n` + Object.entries(entries).map(([key, value]) => `${key}:${value}`).join('\n') + '\n\n';
  let text = `# RaspyDarts : ${new Date().toISOString().slice(0, 10)}, ${location.href.split('#')[0]}\n`;
  text += `# ${card ? card.name : t('f-other')}\n\n`;
  const globals = {locale: $('locale').value, videos: radio('videos') || '2', play_firstname: radio('announce') === 'off' ? 'False' : 'True'};
  if (radio('sounds') === 'off') globals.soundvolume = '0';
  text += section('SectionGlobals', globals);
  text += section('SectionAdvanced', {interior: card && card.interior ? 'True' : 'False'});
  text += section('Raspberry_BoardPinsOuts', outputs);
  text += section('Raspberry_BoardPinsIns', inputs);
  text += section('SectionKeys', keys);
  text += section('Raspberry_Leds', leds);
  if (targetMap) text += section('LEDTarget', targetMap);
  text += section('Raspberry', extended);
  // Camera USB (la premiere branchee) ou aucune ; joueurs favoris
  text += section('Camera', {camera_id: radio('camera') === 'usb' ? '0' : '-1'});
  const players = $('players').value.split(/[\n,]/).map((name) => name.trim()).filter(Boolean);
  if (players.length) text += section('Favorites', {firstnames: players.join(',')});
  return {text, errors, marked, known: Boolean(card)};
}

let current = {text: '', errors: []};
function update() {
  const code = $('card').value;
  $('custom-pins').classList.toggle('hidden', code !== 'Au');
  $('card-hint').textContent = t(code === 'Au' ? 'f-card-other' : 'f-card-known');
  const kind = radio('tl-kind') || 'none';
  $('target-led-fields').classList.toggle('hidden', kind === 'none');
  $('target-other').classList.toggle('hidden', kind !== 'other');
  $('tl-map-fields').classList.toggle('hidden', kind !== 'other' || radio('tl-map') !== 'manual');
  $('strip-led-fields').classList.toggle('hidden', !$('strip-led').checked);
  document.querySelectorAll('.bad').forEach((element) => element.classList.remove('bad'));
  current = build();
  current.marked.forEach((element) => element.classList.add('bad'));
  $('errors').innerHTML = current.errors.map((error) => `<li>${error}</li>`).join('');
  // Ecran de fin : pret, ou les questions a revoir
  const review = [...new Set(current.marked.map((element) => element.closest('.cfg-slide')).filter(Boolean))];
  $('cfg-review').innerHTML = '';
  review.forEach((slide) => {
    const button = document.createElement('button');
    button.className = 'main ghost';
    button.textContent = `↩ ${slide.querySelector('h3').textContent}`;
    button.addEventListener('click', () => showCfg([...CFG_SLIDES].indexOf(slide)));
    $('cfg-review').appendChild(button);
  });
  $('cfg-ready').classList.toggle('hidden', current.errors.length > 0);
  keepAnswers();
  $('save-sd').disabled = $('download').disabled = current.errors.length > 0;
  $('save-errors').classList.toggle('hidden', current.errors.length === 0);
  $('s5-calibration').classList.toggle('hidden', current.known && stored('own') !== '1');
  $('save-hint').innerHTML = t('showSaveFilePicker' in window ? 'save-hint-ok' : 'save-hint-no');
  $('save-sd').classList.toggle('hidden', !('showSaveFilePicker' in window));
  $('own-hint').innerHTML = t('showSaveFilePicker' in window ? 'own-hint-ok' : 'own-hint-no');
  store('card', code);
  store('mcp', $('mcp-count').value);
}

// The file of the game is read by Python (configparser) : UTF-8, Unix lines
function blob() {
  return new Blob([current.text], {type: 'text/plain;charset=utf-8'});
}

$('download').addEventListener('click', () => {
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob());
  link.download = 'raspydarts.cfg';
  link.click();
  URL.revokeObjectURL(link.href);
  $('save-status').textContent = t('downloaded');
});

// "Save as" of the browser (Chrome, Edge) : the drive bootfs is chosen there, the name is given
async function saveAs(data, status) {
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: 'raspydarts.cfg',
      types: [{description: 'RaspyDarts', accept: {'text/plain': ['.cfg']}}]
    });
    const writable = await handle.createWritable();
    await writable.write(data);
    await writable.close();
    status.textContent = t('saved');
  } catch (error) {
    if (error.name !== 'AbortError') status.textContent = error.message;
  }
}
$('save-sd').addEventListener('click', () => saveAs(blob(), $('save-status')));

// Their own file : read, then written as it is (same bytes) under the name raspydarts.cfg
let ownData = null;
$('own-pick').addEventListener('click', () => $('own-input').click());
$('own-input').addEventListener('change', async () => {
  const file = $('own-input').files[0];
  $('own-input').value = '';
  if (!file) return;
  const data = await file.arrayBuffer();
  const text = new TextDecoder().decode(data);
  // A configuration of the game : sections [Name], small
  const looks = data.byteLength < 512 * 1024 && /^\s*\[[A-Za-z_][\w-]*\]\s*$/m.test(text);
  ownData = looks ? data : null;
  $('own-name').textContent = file.name;
  $('own-status').textContent = '';
  $('own-error').classList.toggle('hidden', looks);
  $('own-save').classList.toggle('hidden', !looks || !('showSaveFilePicker' in window));
});
$('own-save-sd').addEventListener('click', () => {
  if (ownData) saveAs(new Blob([ownData], {type: 'text/plain'}), $('own-status'));
});


// Step 2 : one screenshot of Raspberry Pi Imager at a time
let slide = 0;
const SLIDES = document.querySelectorAll('.slide');
function showSlide(index) {
  slide = (index + SLIDES.length) % SLIDES.length;
  SLIDES.forEach((element, number) => element.classList.toggle('active', number === slide));
  $('dots').querySelectorAll('button').forEach((dot, number) => dot.classList.toggle('active', number === slide));
  // Last screenshot : the arrows lead to the next step
  const last = slide === SLIDES.length - 1;
  $('slide-next').textContent = last ? `${t('next-step')} ›` : '›';
  $('slide-next').classList.toggle('wide', last);
  SLIDES[slide].querySelector('.side.right').textContent = last ? `${t('next-step')} ›` : '›';
  SLIDES[slide].querySelector('.side.right').classList.toggle('wide', last);
}
function nextSlide() {
  if (slide === SLIDES.length - 1) show(3);
  else showSlide(slide + 1);
}
SLIDES.forEach((_element, number) => {
  const dot = document.createElement('button');
  dot.textContent = number + 1;
  dot.addEventListener('click', () => showSlide(number));
  $('dots').appendChild(dot);
});
$('slide-prev').addEventListener('click', () => showSlide(slide - 1));
// Arrows on each screenshot too
SLIDES.forEach((element) => {
  const figure = element.querySelector('figure');
  for (const [side, move, text] of [['left', -1, '‹'], ['right', 1, '›']]) {
    const button = document.createElement('button');
    button.className = `side ${side}`;
    button.textContent = text;
    button.setAttribute('aria-label', text);
    button.addEventListener('click', () => (move > 0 ? nextSlide() : showSlide(slide - 1)));
    figure.appendChild(button);
  }
});
$('slide-next').addEventListener('click', nextSlide);
document.addEventListener('keydown', (event) => {
  if (step !== 2 || ['INPUT', 'SELECT', 'TEXTAREA'].includes(event.target.tagName)) return;
  if (event.key === 'ArrowLeft') showSlide(slide - 1);
  if (event.key === 'ArrowRight') nextSlide();
});
// Swipe on a phone
let touchX = null;
$('carousel').addEventListener('touchstart', (event) => { touchX = event.touches[0].clientX; }, {passive: true});
$('carousel').addEventListener('touchend', (event) => {
  if (touchX === null) return;
  const moved = event.changedTouches[0].clientX - touchX;
  if (Math.abs(moved) > 50) (moved < 0 ? nextSlide() : showSlide(slide - 1));
  touchX = null;
});
showSlide(0);

// Step 3 : a file already made, only to put on the card
function ownFile(own) {
  $('config-form').classList.toggle('hidden', own);
  $('own-file').classList.toggle('hidden', own);
  $('own-file-info').classList.toggle('hidden', !own);
  $('own-file-copy').classList.toggle('hidden', !own);
  $('made-file').classList.toggle('hidden', own);
  $('s5-calibration').classList.toggle('hidden', !own && current.known);
  store('own', own ? '1' : '');
}
$('own-file').addEventListener('click', () => { ownFile(true); show(5); });
$('own-file-undo').addEventListener('click', () => ownFile(false));
$('own-file-undo4').addEventListener('click', () => { ownFile(false); show(3); });
window.addEventListener('hashchange', () => show(Number(location.hash.slice(1)) || 1));

document.querySelectorAll('[data-copy]').forEach((button) => {
  button.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText($(button.dataset.copy).textContent);
      button.textContent = t('copied');
      setTimeout(() => { button.textContent = t('copy'); }, 1500);
    } catch (error) { /* the address stays selectable */ }
  });
});

document.querySelectorAll('[data-move]').forEach((button) => {
  button.addEventListener('click', () => {
    const move = Number(button.dataset.move);
    if (move > 0) offerCopy();
    show(step + move);
  });
});
document.querySelectorAll('#steps').forEach((nav) => nav.addEventListener('click', offerCopy, true));
$('lang').addEventListener('change', () => {
  lang = $('lang').value;
  store('lang', lang);
  $('locale').value = LOCALES[lang];
  translate();
});
$('card').addEventListener('change', () => {
  // The buttons of the card chosen, until changed by hand
  $('mcp-pins').innerHTML = '';
  fillMcp();
  update();
});
$('mcp-count').addEventListener('change', () => { fillMcp(); update(); });
document.querySelector('section[data-step="3"]').addEventListener('input', update);

// ------------------------------------------------------------------ etape 3 : une question par ecran
const CFG_SLIDES = document.querySelectorAll('.cfg-slide');
let cfgSlide = 0;
function showCfg(index) {
  cfgSlide = Math.min(Math.max(index, 0), CFG_SLIDES.length - 1);
  CFG_SLIDES.forEach((slide, number) => slide.classList.toggle('active', number === cfgSlide));
  $('cfg-dots').querySelectorAll('button').forEach((dot, number) => dot.classList.toggle('active', number === cfgSlide));
  $('cfg-prev').disabled = cfgSlide === 0;
  // Derniere question : la fleche mene a l'etape suivante
  const last = cfgSlide === CFG_SLIDES.length - 1;
  $('cfg-next').textContent = last ? `${t('next-step')} ›` : '›';
  $('cfg-next').classList.toggle('wide', last);
  store('cfg-slide', cfgSlide);
}
CFG_SLIDES.forEach((slide, number) => {
  const dot = document.createElement('button');
  dot.textContent = number + 1;
  dot.addEventListener('click', () => showCfg(number));
  $('cfg-dots').appendChild(dot);
});
$('cfg-prev').addEventListener('click', () => showCfg(cfgSlide - 1));
$('cfg-next').addEventListener('click', () => {
  if (cfgSlide === CFG_SLIDES.length - 1) { offerCopy(); show(4); } else showCfg(cfgSlide + 1);
});
// Les numeros des LED de chaque segment (S, D, T, E de 1 a 20, puis SB et DB)
(function buildLedMap() {
  const segments = [];
  for (let n = 1; n <= 20; n++) for (const kind of ['S', 'D', 'T', 'E']) segments.push(`${kind}${n}`);
  segments.push('SB', 'DB');
  for (const segment of segments) {
    const box = document.createElement('div');
    box.innerHTML = `<label class="seg-name" for="tlm-${segment}">${segment}</label><input type="text" id="tlm-${segment}" data-segment="${segment}" data-keep${segment === 'S1' ? ' placeholder="12,13,14"' : ''}>`;
    $('tl-map').appendChild(box);
  }
})();
// Les reponses gardees dans le navigateur (la page rouverte les retrouve)
let answersReady = false;   // pas avant d'avoir relu celles gardees (sinon les defauts les effacent)
function keepAnswers() {
  if (!answersReady) return;
  const answers = {};
  document.querySelectorAll('#config-form [data-keep]').forEach((element) => {
    if (element.type === 'radio') { if (element.checked) answers[`radio:${element.name}`] = element.value; }
    else if (element.type === 'checkbox') answers[element.id] = element.checked;
    else answers[element.id] = element.value;
  });
  store('cfg-answers', JSON.stringify(answers));
}
function restoreAnswers() {
  let answers = {};
  try { answers = JSON.parse(stored('cfg-answers') || '{}') || {}; } catch (error) { answers = {}; }
  // Par defaut : les reglages du jeu (toutes les videos, le son, l'annonce, pas de camera, pas de LED)
  const defaults = {'radio:tl-kind': 'none', 'radio:tl-map': 'later', 'radio:videos': '2', 'radio:sounds': 'on', 'radio:announce': 'on', 'radio:camera': 'off'};
  answers = Object.assign({}, defaults, answers);
  for (const [key, value] of Object.entries(answers)) {
    if (key.startsWith('radio:')) {
      const input = document.querySelector(`input[name="${key.slice(6)}"][value="${value}"]`);
      if (input) input.checked = true;
    } else if ($(key)) {
      if ($(key).type === 'checkbox') $(key).checked = !!value; else $(key).value = value;
    }
  }
  answersReady = true;
}
document.querySelector('section[data-step="3"]').addEventListener('change', update);

// ------------------------------------------------------------------ menus (etape 4)
// Le configurateur (menus.html) garde le fichier dans le navigateur (meme cle) : cette page le
// lit pour en enregistrer une copie et le deposer sur la carte (.raspydarts/menus.yaml, que la
// borne recupere au demarrage avec les images chargees)
function menusData() {
  try {
    const data = JSON.parse(stored('menus-file') || 'null');
    return data && typeof data === 'object' && !Array.isArray(data) && Object.keys(data).length ? data : null;
  } catch (error) { return null; }
}
function menusYaml() {
  const data = menusData() || {};
  const body = Object.keys(data).length ? jsyaml.dump(data, {lineWidth: 140, noRefs: true}) : '';
  return `# ${t('sm-yaml-header')}\n# docs/menu/menus.md\nversion: 1\n` + body.replace(/^version: 1\n/m, '');
}
function menusTheme(raw) {
  // Le theme de ces menus (choisi ici ou dans le configurateur) ; remi : l'ancien nom de sombre
  let theme = stored('menus-theme') || 'sombre';
  if (theme === 'remi') theme = 'sombre';
  if (raw || theme !== 'own') return theme;
  return (stored('menus-theme-name') || '').trim().replace(/[\\/:*?"<>|]/g, '_');
}
function cfgText() { return current && !current.errors.length && stored('own') !== '1' ? current.text : null; }
function downloadText(text, name) {
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([text], {type: 'text/plain;charset=utf-8'}));
  link.download = name;
  link.click();
  URL.revokeObjectURL(link.href);
}
function copyCfg() {
  const text = cfgText();
  if (!text) return;
  downloadText(text, 'raspydarts.cfg');
  store('cfg-saved', text);
  $('cfg-copy-status').textContent = t('downloaded');
}
function copyMenus() {
  if (!menusData()) return;
  downloadText(menusYaml(), 'menus.yaml');
  store('menus-saved', menusYaml());
  $('menus-copy-status').textContent = t('downloaded');
}
function offerCopy() {
  // En quittant une etape ou un fichier a ete fait : en garder une copie (rien n'est perdu)
  if (step === 3 && cfgText() && stored('cfg-saved') !== cfgText() && confirm(t('save-before-next-cfg'))) copyCfg();
  if (step === 4 && ['make', 'own'].includes(stored('menus-choice')) && menusData() && stored('menus-saved') !== menusYaml() &&
      confirm(t('save-before-next-menus'))) copyMenus();
}
function updateMenus() {
  const choice = stored('menus-choice') || '';
  [['make', 'menus-make'], ['own', 'menus-have'], ['skip', 'menus-skip']].forEach(([value, id]) => $(id).classList.toggle('chosen', choice === value));
  $('menus-editor').classList.toggle('hidden', choice !== 'make');
  if (choice === 'make' && !$('menus-frame').getAttribute('src')) $('menus-frame').setAttribute('src', 'menus.html?embedded=1');
  $('menus-savebar').classList.toggle('hidden', !['make', 'own'].includes(choice));
  $('menus-theme-box').classList.toggle('hidden', !['make', 'own'].includes(choice));
  $('menus-theme').value = menusTheme(true);
  $('menus-theme-name').classList.toggle('hidden', menusTheme(true) !== 'own');
  $('menus-theme-name').value = stored('menus-theme-name') || '';
  $('menus-theme-name').placeholder = t('sm-theme-name');
  $('menus-skipped').classList.toggle('hidden', choice !== 'skip');
  $('menus-own-info').classList.toggle('hidden', choice !== 'own' || !menusData());
  document.body.classList.toggle('wide', step === 4 && choice === 'make');
  // Etape Deposer : les menus, s'il y en a
  const deposit = ['make', 'own'].includes(choice) && !!menusData();
  $('menus-deposit').classList.toggle('hidden', !deposit);
  const picker = 'showDirectoryPicker' in window;
  $('menus-save-sd').classList.toggle('hidden', !picker);
  $('menus-sd-hint').innerHTML = t(picker ? 'sd-menus-hint-ok' : 'sd-menus-hint-no', {theme: menusTheme() || '&lt;thème&gt;'});
}
$('menus-make').addEventListener('click', () => { store('menus-choice', 'make'); updateMenus(); });
$('menus-skip').addEventListener('click', () => { store('menus-choice', 'skip'); updateMenus(); show(5); });
$('menus-have').addEventListener('click', () => $('menus-input').click());
$('menus-input').addEventListener('change', async () => {
  const file = $('menus-input').files[0];
  $('menus-input').value = '';
  if (!file) return;
  let content = null;
  try {
    content = jsyaml.load(await file.text());
  } catch (error) {
    content = null;
  }
  if (!content || typeof content !== 'object' || Array.isArray(content)) {
    $('menus-error').textContent = t('sm-own-bad');
    $('menus-error').classList.remove('hidden');
    updateMenus();
    return;
  }
  delete content.version;
  store('menus-file', JSON.stringify(content));
  store('menus-choice', 'own');
  $('menus-error').classList.add('hidden');
  $('menus-own-info').textContent = t('sm-own-ok', {name: file.name});
  // Le configurateur deja ouvert le relit (une nouvelle adresse : permis meme hors serveur)
  if ($('menus-frame').getAttribute('src')) $('menus-frame').setAttribute('src', `menus.html?embedded=1&t=${Date.now()}`);
  updateMenus();
});
$('menus-copy').addEventListener('click', copyMenus);
$('menus-theme').addEventListener('change', () => {
  store('menus-theme', $('menus-theme').value);
  // Le configurateur ouvert prend ce theme (une nouvelle adresse : permis meme hors serveur)
  if ($('menus-frame').getAttribute('src')) $('menus-frame').setAttribute('src', `menus.html?embedded=1&t=${Date.now()}`);
  updateMenus();
});
$('menus-theme-name').addEventListener('change', () => { store('menus-theme-name', $('menus-theme-name').value.trim()); updateMenus(); });
// Le configurateur donne sa hauteur : le cadre l'affiche en entier (pas de barre de defilement)
window.addEventListener('message', (event) => {
  if (event.data && event.data.menusHeight && event.source === $('menus-frame').contentWindow) {
    $('menus-frame').style.height = `${Math.ceil(event.data.menusHeight) + 4}px`;
  }
});
$('cfg-copy').addEventListener('click', copyCfg);
$('menus-download').addEventListener('click', () => { downloadText(menusYaml(), 'menus.yaml'); $('menus-sd-status').textContent = t('downloaded'); });
async function writeFile(directory, name, data) {
  const handle = await directory.getFileHandle(name, {create: true});
  const writable = await handle.createWritable();
  await writable.write(data);
  await writable.close();
}
$('menus-save-sd').addEventListener('click', async () => {
  // La carte (bootfs) choisie : .raspydarts/menus.yaml et les images chargees dans le configurateur
  const status = $('menus-sd-status');
  const theme = menusTheme();
  if (!theme) { status.textContent = t('sm-theme-missing'); return; }
  try {
    const card = await window.showDirectoryPicker({id: 'bootfs', mode: 'readwrite'});
    let boot = true;
    try { await card.getFileHandle('config.txt'); } catch (error) { boot = false; }
    if (!boot && !confirm(t('sd-not-boot'))) return;
    // .raspydarts/themes/<theme>/menu/menus.yaml, et les images dans le dossier du theme
    let folder = await card.getDirectoryHandle('.raspydarts', {create: true});
    folder = await (await folder.getDirectoryHandle('themes', {create: true})).getDirectoryHandle(theme, {create: true});
    await writeFile(await folder.getDirectoryHandle('menu', {create: true}), 'menus.yaml', new Blob([menusYaml()], {type: 'text/yaml'}));
    let images = {};
    try { images = ($('menus-frame').contentWindow || {}).menusOwnImages || {}; } catch (error) { images = {}; }
    let count = 0;
    for (const [path, url] of Object.entries(images)) {
      const parts = path.split('/');
      let directory = folder;
      for (const part of parts.slice(0, -1)) directory = await directory.getDirectoryHandle(part, {create: true});
      await writeFile(directory, parts[parts.length - 1], await (await fetch(url)).blob());
      count++;
    }
    status.textContent = t('sd-menus-ok', {n: count});
  } catch (error) {
    if (error.name !== 'AbortError') status.textContent = `${t('sd-menus-fail')} ${error.message}`;
  }
});

// ------------------------------------------------------------------ start
$('repo-url').textContent = REPO_URL;
pinFields($('outputs'), PRESETS.outputs, 'out');
pinFields($('inputs'), PRESETS.inputs, 'in');
const browser = (navigator.language || 'fr').slice(0, 2);
lang = stored('lang') || (LANGS.includes(browser) ? browser : 'en');
$('lang').value = lang;
$('locale').value = LOCALES[lang];
translate();
restoreAnswers();
update();
showCfg(Number(stored('cfg-slide')) || 0);
ownFile(stored('own') === '1');
if (stored('menus-choice') === 'own' && menusData()) $('menus-own-info').textContent = t('sm-own-ok', {name: 'menus.yaml'});
// index.html#3 : the step 3 directly
show(Number(location.hash.slice(1)) || Number(stored('step')) || 1);
</script>
</body>
