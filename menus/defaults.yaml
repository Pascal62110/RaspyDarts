# Menus par défaut de RaspyDarts (voir docs/menu/menus.md).
#
# Ne pas modifier ce fichier pour personnaliser les menus : il est remplacé à chaque mise à
# jour. Écrire plutôt ~/.raspydarts/menus.yaml (ou le menus.yaml d'un thème), qui ne
# contient que ce qui change.

version: 1
resolution: auto

defaults:
  style: classic
  layout: list

styles:
  # Les boutons de toujours : raccourci à gauche, texte, couleurs du thème (Colorset.cfg)
  classic: {}

navigation:
  up: [up, btn:up, dart:S20]
  down: [down, btn:down, dart:S3]
  left: [left, btn:left, dart:S11]
  right: [right, btn:right, dart:S6]
  next: []
  previous: []
  validate: [enter, btn:game, btn:validate, btn:nextplayer, dart:SB, dart:DB]
  back: [escape, btn:back, btn:cancel]

menus:
  main:
    title: game-type-menu
    show_version: true
    buttons:
      - id: local
        action: local_game
        text: game-type-local
        shortcut: F1
        exhibition: true
      - id: netjoin
        action: network_join
        text: game-type-master
        shortcut: F2
      - id: netcreate
        action: network_create
        text: game-type-manual
        shortcut: F3
      - id: miscellaneous
        action: menu:miscellaneous
        text: miscellaneous
        shortcut: F4
      - id: trophees
        action: trophies
        text: trophees
        shortcut: F5
        exhibition: true
      - id: gallery
        action: gallery
        text: gallery
        shortcut: F6
        exhibition: true
      - id: infos
        action: infos
        shortcut: F9
        visible: false
      - id: restart
        action: restart
        shortcut: F11
        visible: false
      - id: quit
        action: desktop
        text: back-to-desktop
        shortcut: F12
        space_before: 1.5
      - id: shutdown
        action: shutdown
        text: exit
        shortcut: escape
        space_before: 0.5
        confirm: realy-stop

  miscellaneous:
    title: parameters
    info: [ips, rpi_version, version]
    remember: true
    buttons:
      - id: firstnames
        action: favorite_players
        text: favorites-players
        shortcut: F1
      - id: games
        action: favorite_games
        text: favorites-games
        shortcut: F2
      - id: servers
        action: favorite_servers
        text: favorites-servers
        shortcut: F3
      - id: customization
        action: customization
        text: customization
        shortcut: F4
      - id: animations
        action: animations
        text: animations
        shortcut: F5
      - id: firstname-bank
        action: players_bank
        text: players-bank
        shortcut: F6
      - id: setup
        action: menu:settings
        text: setup
        shortcut: F7
      - id: backups
        action: backups
        text: backups
        shortcut: F8
      - id: exhibition
        action: exhibition
        text: exhibition
        shortcut: F9
      - id: back
        action: back
        text: back
        shortcut: escape
        footer: left
      - id: update
        action: update
        text: btn_update
        footer: right
